<title>Finanças Residência Rodrigues</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap">
<style>
/* Layout: app de uma coluna — cabeçalho fixo com mês e abas, conteúdo em seções empilhadas, botão flutuante para lançar. */
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --ink: #12161c;
  --ink-2: #4b5360;
  --muted: #7d8592;
  --line: #e2e6eb;
  --base: #c5cbd3;
  --accent: #1d6a57;
  --accent-ink: #ffffff;
  --accent-soft: #e3f1ec;
  --s1: #2a78d6; /* receitas / Daniel */
  --s2: #eb6834; /* despesas / Roberta */
  --s3: #1baf7a; /* os dois */
  --good: #0ca30c;
  --good-ink: #006300;
  --warn: #fab219;
  --warn-ink: #8a5a00;
  --crit: #d03b3b;
  --crit-ink: #b42b2b;
  --shadow: 0 1px 2px rgba(18,22,28,.06), 0 4px 16px rgba(18,22,28,.06);
  --f-display: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1114; --surface: #171b20; --ink: #eef1f4; --ink-2: #b6bdc7; --muted: #848c97;
    --line: #262c33; --base: #39414a; --accent: #5cc2a5; --accent-ink: #0b1a15; --accent-soft: #15302a;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --good: #0ca30c; --good-ink: #3cc63c; --warn: #fab219; --warn-ink: #f5c04a; --crit: #d03b3b; --crit-ink: #ef7272;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1114; --surface: #171b20; --ink: #eef1f4; --ink-2: #b6bdc7; --muted: #848c97;
  --line: #262c33; --base: #39414a; --accent: #5cc2a5; --accent-ink: #0b1a15; --accent-soft: #15302a;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --good: #0ca30c; --good-ink: #3cc63c; --warn: #fab219; --warn-ink: #f5c04a; --crit: #d03b3b; --crit-ink: #ef7272;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Cabeçalho */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 10px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand small { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.brand h1 { font-size: 20px; font-weight: 800; }
.month { display: flex; align-items: center; gap: 4px; }
.month button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.month button:hover { background: var(--bg); }
.month strong { font-family: var(--f-display); font-size: 16px; min-width: 150px; text-align: center; text-transform: capitalize; }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav.tabs a { padding: 8px 12px 10px; color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: 14px; border-bottom: 2px solid transparent; white-space: nowrap; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

.notice { margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); color: var(--ink); font-size: 14px; }
.notice[data-kind="warn"] { background: color-mix(in srgb, var(--warn) 18%, var(--surface)); }

main { padding-block: 20px 110px; display: grid; gap: 20px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.card h2 { font-size: 16px; font-weight: 700; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.card-head .sub { color: var(--muted); font-size: 13px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px; }
.kpi .lbl { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
.kpi .val { font-family: var(--f-display); font-weight: 800; font-size: 26px; letter-spacing: -0.02em; }
.kpi .meta { font-size: 13px; color: var(--ink-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.up { color: var(--crit-ink); }
.down { color: var(--good-ink); }
.pos { color: var(--good-ink); }
.neg { color: var(--crit-ink); }

/* Barras de categoria */
.cats { display: grid; gap: 10px; }
.cat-row { display: grid; grid-template-columns: minmax(90px, 140px) 1fr auto; gap: 10px; align-items: center; font-size: 14px; }
.cat-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.track { height: 10px; background: var(--bg); border-radius: 5px; position: relative; overflow: visible; }
.fill { height: 100%; border-radius: 5px; background: var(--s2); }
.limit-mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 1px; }
.cat-row .v { text-align: right; min-width: 90px; }
.cat-row .v small { color: var(--muted); display: block; font-size: 12px; line-height: 1.2; }

/* Gráfico */
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart { position: relative; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 8px; padding: 8px 10px; font-size: 13px; min-width: 170px; z-index: 2; }
.tip b { display: block; margin-bottom: 4px; text-transform: capitalize; }
.tip div { display: flex; justify-content: space-between; gap: 12px; }
details.table-view { margin-top: 10px; font-size: 13px; color: var(--ink-2); }
details.table-view summary { cursor: pointer; color: var(--muted); }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; margin-top: 8px; }
th, td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }

/* Divisão por pessoa */
.split { display: flex; gap: 2px; height: 14px; border-radius: 7px; overflow: hidden; background: var(--bg); margin: 6px 0 14px; }
.split div { height: 100%; }
.people { display: grid; gap: 8px; }
.person { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; }
.person span:first-child { display: inline-flex; align-items: center; gap: 8px; }

/* Listas */
.list { display: grid; }
.day-head { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 14px 0 6px; display: flex; justify-content: space-between; }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 8px; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; border-radius: 0; }
.item:hover { background: var(--bg); }
.item .ic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--bg); color: var(--ink-2); font-family: var(--f-display); }
.item .t { min-width: 0; }
.item .t b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .t small { color: var(--muted); font-size: 13px; }
.item .amt { font-weight: 600; text-align: right; }

.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid var(--line); white-space: nowrap; }
.chip.ok { color: var(--good-ink); border-color: color-mix(in srgb, var(--good) 40%, transparent); background: color-mix(in srgb, var(--good) 10%, transparent); }
.chip.wait { color: var(--warn-ink); border-color: color-mix(in srgb, var(--warn) 50%, transparent); background: color-mix(in srgb, var(--warn) 12%, transparent); }
.chip.late { color: var(--crit-ink); border-color: color-mix(in srgb, var(--crit) 40%, transparent); background: color-mix(in srgb, var(--crit) 10%, transparent); }

.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.filters select, .filters input { padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); min-width: 0; }
.filters input { flex: 1 1 180px; }
.totals { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); padding: 6px 0 2px; }

/* Orçamento */
.bud { display: grid; gap: 14px; }
.bud-row { display: grid; grid-template-columns: minmax(110px, 170px) 1fr 130px; gap: 12px; align-items: center; }
.bud-row .bar { display: grid; gap: 4px; min-width: 0; }
.bud-row .bar .track { height: 8px; }
.bud-row .bar small { font-size: 12px; color: var(--ink-2); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.money-in { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 0 8px; }
.money-in span { color: var(--muted); font-size: 13px; }
.money-in input { border: 0; background: none; padding: 7px 4px; width: 100%; min-width: 0; text-align: right; outline: none; }
.money-in:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }

/* Fixas */
.fx { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 12px 4px; border-top: 1px solid var(--line); }
.fx .t b { display: block; }
.fx .t small { color: var(--muted); font-size: 13px; }
.fx .acts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 9px; font-weight: 600; font-size: 14px; }
.btn:hover { background: var(--bg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--crit-ink); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.link { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 0; font-size: 14px; }

.fab { position: fixed; right: max(20px, calc(env(safe-area-inset-right, 0px) + 16px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); z-index: 6; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 14px 22px; font-weight: 700; font-family: var(--f-display); font-size: 16px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 8px; }

.empty { text-align: center; padding: 28px 12px; color: var(--ink-2); display: grid; gap: 8px; justify-items: center; }
.empty b { color: var(--ink); font-family: var(--f-display); font-size: 16px; }
.empty p { margin: 0; max-width: 44ch; font-size: 14px; }

/* Formulário (folha) */
.sheet-bg { position: fixed; inset: 0; background: rgba(10,12,15,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 520px; border-radius: 16px 16px 0 0; padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; max-height: 92vh; overflow-y: auto; }
@media (min-width: 640px) { .sheet-bg { align-items: center; } .sheet { border-radius: 16px; } }
.sheet h3 { font-size: 18px; }
.field { display: grid; gap: 5px; }
.field > label, .field > .lab { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.field input, .field select { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); width: 100%; }
.field .money-in input { padding: 10px 4px; font-size: 20px; font-weight: 700; font-family: var(--f-display); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: none; padding: 8px 6px; border-radius: 7px; font-weight: 600; font-size: 14px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); }
.sheet .acts { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.sheet .acts .right { display: flex; gap: 8px; margin-left: auto; }
.err { color: var(--crit-ink); font-size: 13px; margin: 0; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 30; box-shadow: var(--shadow); }

@media (max-width: 560px) {
  .cat-row { grid-template-columns: 92px 1fr auto; }
  .bud-row { grid-template-columns: 1fr 120px; }
  .bud-row .bar { grid-column: 1 / -1; grid-row: 2; }
  .month strong { min-width: 120px; font-size: 15px; }
  .kpi .val { font-size: 22px; }
  .fx { grid-template-columns: 1fr auto; }
  .fx .acts { grid-column: 1 / -1; justify-content: flex-start; }
}
@media (prefers-reduced-motion: no-preference) {
  .fill, .split div { transition: width .35s ease; }
}
</style>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand"><small>Residência Rodrigues</small><h1>Finanças da casa</h1></div>
      <div class="month" aria-label="Mês">
        <button id="prev" aria-label="Mês anterior">‹</button>
        <strong id="month-label" class="num"></strong>
        <button id="next" aria-label="Próximo mês">›</button>
      </div>
    </div>
    <nav class="tabs" aria-label="Seções">
      <a href="#resumo" data-v="resumo">Resumo</a>
      <a href="#lancamentos" data-v="lancamentos">Lançamentos</a>
      <a href="#orcamento" data-v="orcamento">Orçamento</a>
      <a href="#fixas" data-v="fixas">Contas fixas</a>
    </nav>
  </div>
</header>

<div class="wrap"><div id="notice" class="notice" hidden></div></div>
<main class="wrap" id="view" aria-live="polite"></main>

<button class="fab" id="fab" type="button"><span aria-hidden="true">+</span> Lançar</button>
<div id="sheet-root"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function () {
  "use strict";

  // ---------- Constantes ----------
  const PESSOAS = ["Daniel", "Roberta", "Os dois"];
  const PESSOA_COR = { "Daniel": "var(--s1)", "Roberta": "var(--s2)", "Os dois": "var(--s3)" };
  const CAT_DESPESA = ["Moradia", "Mercado", "Contas da casa", "Transporte", "Saúde", "Restaurantes", "Lazer", "Educação", "Compras", "Pets", "Outros"];
  const CAT_RECEITA = ["Salário", "Renda extra", "Outros"];
  const SIGLA = { "Moradia": "MO", "Mercado": "ME", "Contas da casa": "CC", "Transporte": "TR", "Saúde": "SA", "Restaurantes": "RE", "Lazer": "LZ", "Educação": "ED", "Compras": "CO", "Pets": "PE", "Outros": "OU", "Salário": "SL", "Renda extra": "RX" };

  // ---------- Estado ----------
  const state = {
    ym: ymOf(new Date()),
    view: "resumo",
    lanc: new Map(),
    fixas: new Map(),
    limites: {},
    loaded: { lanc: false, fixas: false, orc: false },
    db: null,
    mode: "connecting", // connecting | db | memory
    readOnly: false,
    filters: { tipo: "todos", pessoa: "todas", cat: "todas", q: "" },
    pendingRender: false,
  };
  let unsubLanc = null, loadTimer = null;

  // ---------- Utilidades ----------
  function pad(n) { return String(n).padStart(2, "0"); }
  function ymOf(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1); }
  function todayISO() { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function addMonths(ym, k) { const [y, m] = ym.split("-").map(Number); const d = new Date(y, m - 1 + k, 1); return ymOf(d); }
  function daysIn(ym) { const [y, m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); }
  const fmtMonth = new Intl.DateTimeFormat("pt-BR", { month: "long", year: "numeric" });
  const fmtMonthShort = new Intl.DateTimeFormat("pt-BR", { month: "short" });
  const fmtDay = new Intl.DateTimeFormat("pt-BR", { weekday: "short", day: "numeric", month: "short" });
  function monthDate(ym) { const [y, m] = ym.split("-").map(Number); return new Date(y, m - 1, 1); }
  function monthLabel(ym) { return fmtMonth.format(monthDate(ym)).replace(" de ", " "); }
  function monthShort(ym) { return fmtMonthShort.format(monthDate(ym)).replace(".", ""); }
  const BRL = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
  function money(c) { return BRL.format((c || 0) / 100); }
  function moneyShort(c) {
    const v = (c || 0) / 100;
    if (Math.abs(v) >= 1000) return "R$ " + (v / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " mil";
    return "R$ " + Math.round(v).toLocaleString("pt-BR");
  }
  function parseMoney(s) {
    if (s == null) return NaN;
    let t = String(s).replace(/[R$\s]/g, "");
    if (!t) return NaN;
    if (t.includes(",")) t = t.replace(/\./g, "").replace(",", ".");
    else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, ""); // "1.500" = mil e quinhentos
    const v = Number(t);
    return isFinite(v) ? Math.round(v * 100) : NaN;
  }
  function centsToInput(c) { return c ? (c / 100).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : ""; }
  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch])); }
  function sum(arr, f) { return arr.reduce((a, x) => a + (f ? f(x) : x), 0); }
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 2600);
  }
  function notice(msg, kind) {
    const n = document.getElementById("notice");
    if (!msg) { n.hidden = true; return; }
    n.textContent = msg; n.dataset.kind = kind || ""; n.hidden = false;
  }

  // ---------- Derivados ----------
  function lancDoMes(ym) { return [...state.lanc.values()].filter((l) => l.data && l.data.startsWith(ym)); }
  function totaisMes(ym) {
    const ls = lancDoMes(ym);
    const rec = sum(ls.filter((l) => l.tipo === "receita"), (l) => l.valor);
    const des = sum(ls.filter((l) => l.tipo === "despesa"), (l) => l.valor);
    return { rec, des, saldo: rec - des, ls };
  }
  function pagamentoFixa(fixaId, ym) { return [...state.lanc.values()].find((l) => l.fixaId === fixaId && l.data && l.data.startsWith(ym)); }
  function fixasAtivas() { return [...state.fixas.values()].filter((f) => f.ativa !== false).sort((a, b) => (a.dia || 0) - (b.dia || 0) || a.nome.localeCompare(b.nome)); }
  function statusFixa(f, ym) {
    if (pagamentoFixa(f.id, ym)) return "pago";
    const hoje = todayISO();
    const venc = ym + "-" + pad(Math.min(f.dia || 1, daysIn(ym)));
    return venc < hoje ? "atrasado" : "pendente";
  }

  // ---------- Persistência ----------
  async function writeDoc(coll, id, data) {
    if (state.readOnly) { toast("Você só tem acesso de leitura."); return false; }
    try {
      if (state.mode === "db") {
        const ref = id ? state.db.collection(coll).doc(id) : state.db.collection(coll).doc();
        await ref.set(data);
        return ref.id;
      }
      const newId = id || ("m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
      memSet(coll, newId, data);
      return newId;
    } catch (e) { handleWriteError(e); return false; }
  }
  async function deleteDoc(coll, id) {
    if (state.readOnly) { toast("Você só tem acesso de leitura."); return false; }
    try {
      if (state.mode === "db") await state.db.collection(coll).doc(id).delete();
      else memDel(coll, id);
      return true;
    } catch (e) { handleWriteError(e); return false; }
  }
  async function saveLimites(limites) {
    if (state.readOnly) { toast("Você só tem acesso de leitura."); return false; }
    try {
      if (state.mode === "db") await state.db.doc("config/orcamento").set({ limites });
      else { state.limites = limites; render(); }
      return true;
    } catch (e) { handleWriteError(e); return false; }
  }
  function handleWriteError(e) {
    const code = e && e.code;
    if (code === "invalid_argument" || code === "not_granted") {
      state.readOnly = true;
      notice("Seu acesso a esta página é só de leitura. Peça ao dono para te dar acesso de Editor.", "warn");
      render();
    } else if (code === "quota_exceeded") {
      toast("O banco de dados está cheio. Apague lançamentos antigos para continuar.");
    } else {
      toast("Não foi possível salvar. Verifique a conexão e tente de novo.");
    }
  }
  function memSet(coll, id, data) {
    if (coll === "lancamentos") state.lanc.set(id, { id, ...data });
    if (coll === "fixas") state.fixas.set(id, { id, ...data });
    render();
  }
  function memDel(coll, id) {
    if (coll === "lancamentos") state.lanc.delete(id);
    if (coll === "fixas") state.fixas.delete(id);
    render();
  }

  function subscribeLanc() {
    if (state.mode !== "db") return;
    if (unsubLanc) unsubLanc();
    state.loaded.lanc = false;
    const ini = addMonths(state.ym, -5) + "-01";
    const fim = state.ym + "-31";
    startLoadTimer();
    unsubLanc = state.db.collection("lancamentos").where("data", ">=", ini).where("data", "<=", fim)
      .onSnapshot((snap) => {
        state.lanc = new Map(snap.docs.map((d) => [d.id, { id: d.id, ...d.data() }]));
        state.loaded.lanc = true;
        if (!snap.metadata.fromCache) clearLoadTimer();
        render();
      }, onSubError);
  }
  function startLoadTimer() {
    clearTimeout(loadTimer);
    loadTimer = setTimeout(() => notice("Ainda não consegui falar com o banco de dados. Os números podem estar desatualizados.", "warn"), 10000);
  }
  function clearLoadTimer() {
    clearTimeout(loadTimer);
    const n = document.getElementById("notice");
    if (n.dataset.kind === "warn" && !state.readOnly) notice("");
  }
  function onSubError(e) {
    clearTimeout(loadTimer);
    state.loaded = { lanc: true, fixas: true, orc: true };
    if (e && e.code === "revoked") notice("O acesso a esta página mudou. Recarregue para continuar.", "warn");
    else notice("Perdi a conexão com o banco de dados. Recarregue a página para reconectar.", "warn");
    render();
  }

  async function init() {
    let db = null, user = null;
    try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
    try { user = window.claude && window.claude.use ? await window.claude.use("user") : null; } catch (e) { user = null; }
    if (!db) {
      state.mode = "memory";
      state.loaded = { lanc: true, fixas: true, orc: true };
      notice("Modo de teste: abra esta página no Claude para salvar e sincronizar os lançamentos entre vocês dois.", "warn");
      render();
      return;
    }
    state.db = db; state.mode = "db";
    if (user) {
      try { const can = await user.can("data.write"); if (can === false) { state.readOnly = true; notice("Seu acesso a esta página é só de leitura. Peça ao dono para te dar acesso de Editor."); } } catch (e) { /* sem informação */ }
    }
    subscribeLanc();
    db.collection("fixas").onSnapshot((snap) => {
      state.fixas = new Map(snap.docs.map((d) => [d.id, { id: d.id, ...d.data() }]));
      state.loaded.fixas = true; render();
    }, onSubError);
    db.doc("config/orcamento").onSnapshot((snap) => {
      state.limites = (snap.exists && snap.data().limites) || {};
      state.loaded.orc = true; render();
    }, onSubError);
    render();
  }

  // ---------- Render ----------
  function render() {
    const active = document.activeElement;
    if (active && active.closest && active.closest("#view") && /INPUT|SELECT/.test(active.tagName) && active.dataset.keep) {
      state.pendingRender = true; return;
    }
    state.pendingRender = false;
    document.getElementById("month-label").textContent = monthLabel(state.ym);
    document.querySelectorAll("nav.tabs a").forEach((a) => { if (a.dataset.v === state.view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    document.getElementById("fab").hidden = state.readOnly;
    const v = document.getElementById("view");
    const loading = state.mode === "connecting" || !state.loaded.lanc;
    if (loading) { v.innerHTML = `<div class="card"><div class="empty"><b>Carregando as finanças…</b><p>Buscando os lançamentos de ${esc(monthLabel(state.ym))}.</p></div></div>`; return; }
    if (state.view === "lancamentos") v.innerHTML = viewLancamentos();
    else if (state.view === "orcamento") v.innerHTML = viewOrcamento();
    else if (state.view === "fixas") v.innerHTML = viewFixas();
    else v.innerHTML = viewResumo();
    if (state.view === "resumo") wireChart();
  }

  function viewResumo() {
    const ym = state.ym;
    const cur = totaisMes(ym), prev = totaisMes(addMonths(ym, -1));
    const hasAny = cur.ls.length > 0;
    let delta = "";
    if (prev.des > 0) {
      const p = Math.round(((cur.des - prev.des) / prev.des) * 100);
      delta = p === 0 ? "igual ao mês anterior" : `<span class="${p > 0 ? "up" : "down"}">${p > 0 ? "▲" : "▼"} ${Math.abs(p)}%</span> vs ${esc(monthShort(addMonths(ym, -1)))}`;
    } else delta = "sem dados do mês anterior";
    const orcTotal = sum(Object.values(state.limites));
    const fx = fixasAtivas();
    const fxPend = fx.filter((f) => statusFixa(f, ym) !== "pago");

    const kpis = `
      <section class="kpis" aria-label="Resumo do mês">
        <div class="kpi"><span class="lbl"><i class="dot" style="background:var(--s1)"></i>Receitas</span><span class="val num">${money(cur.rec)}</span><span class="meta">${cur.ls.filter((l) => l.tipo === "receita").length} entradas</span></div>
        <div class="kpi"><span class="lbl"><i class="dot" style="background:var(--s2)"></i>Despesas</span><span class="val num">${money(cur.des)}</span><span class="meta">${delta}</span></div>
        <div class="kpi"><span class="lbl">Saldo do mês</span><span class="val num ${cur.saldo >= 0 ? "pos" : "neg"}">${money(cur.saldo)}</span><span class="meta">${cur.rec > 0 ? `${Math.round((cur.saldo / cur.rec) * 100)}% da receita ${cur.saldo >= 0 ? "sobrou" : "faltou"}` : "lance as receitas para ver o saldo"}</span></div>
        <div class="kpi"><span class="lbl">Orçamento usado</span><span class="val num">${orcTotal ? Math.round((cur.des / orcTotal) * 100) + "%" : "—"}</span><span class="meta">${orcTotal ? `${money(cur.des)} de ${money(orcTotal)}` : `<a class="link" href="#orcamento">Definir limites</a>`}</span></div>
      </section>`;

    if (!hasAny && state.lanc.size === 0) {
      return kpis + `
      <section class="card"><div class="empty">
        <b>Nenhum lançamento ainda</b>
        <p>Toque em <strong>+ Lançar</strong> para registrar a primeira despesa ou receita. Os gráficos de categorias, a evolução mensal e a divisão entre Daniel e Roberta aparecem aqui assim que houver dados.</p>
        ${state.readOnly ? "" : `<button class="btn primary" data-act="novo">+ Lançar agora</button>`}
      </div></section>
      ${fx.length ? "" : `<section class="card"><div class="empty"><b>Cadastre as contas fixas</b><p>Aluguel, luz, internet: cadastre uma vez e marque como pagas a cada mês.</p><a class="btn" href="#fixas">Ir para contas fixas</a></div></section>`}`;
    }

    // categorias
    const porCat = {};
    cur.ls.filter((l) => l.tipo === "despesa").forEach((l) => (porCat[l.categoria] = (porCat[l.categoria] || 0) + l.valor));
    const cats = Object.entries(porCat).sort((a, b) => b[1] - a[1]);
    const maxCat = Math.max(1, ...cats.map((c) => Math.max(c[1], state.limites[c[0]] || 0)));
    const catsHtml = cats.length ? `<div class="cats">${cats.map(([c, v]) => {
      const lim = state.limites[c];
      const over = lim && v > lim;
      return `<div class="cat-row"><span class="name" title="${esc(c)}">${esc(c)}</span>
        <div class="track"><div class="fill" style="width:${(v / maxCat) * 100}%;${over ? "background:var(--crit)" : ""}"></div>${lim ? `<i class="limit-mark" style="left:calc(${(lim / maxCat) * 100}% - 1px)" title="Limite ${esc(money(lim))}"></i>` : ""}</div>
        <span class="v num">${money(v)}<small>${cur.des ? Math.round((v / cur.des) * 100) : 0}% ${lim ? `· limite ${moneyShort(lim)}` : ""}</small></span></div>`;
    }).join("")}</div>` : `<div class="empty"><p>Nenhuma despesa em ${esc(monthLabel(ym))}.</p></div>`;

    // pessoas
    const porPessoa = PESSOAS.map((p) => [p, sum(cur.ls.filter((l) => l.tipo === "despesa" && l.pessoa === p), (l) => l.valor)]);
    const totP = sum(porPessoa, (x) => x[1]);
    const pessoasHtml = totP ? `
      <div class="split" role="img" aria-label="Divisão das despesas: ${porPessoa.map(([p, v]) => `${p} ${Math.round((v / totP) * 100)}%`).join(", ")}">
        ${porPessoa.filter((x) => x[1] > 0).map(([p, v]) => `<div style="width:${(v / totP) * 100}%;background:${PESSOA_COR[p]}" title="${esc(p)}"></div>`).join("")}
      </div>
      <div class="people">${porPessoa.map(([p, v]) => `<div class="person"><span><i class="dot" style="background:${PESSOA_COR[p]}"></i>${esc(p)}</span><span class="num"><b>${money(v)}</b> <span style="color:var(--muted)">· ${Math.round((v / totP) * 100)}%</span></span></div>`).join("")}</div>`
      : `<div class="empty"><p>Sem despesas neste mês.</p></div>`;

    // fixas
    const fxHtml = fx.length ? `<div class="people">${fx.slice(0, 6).map((f) => {
      const s = statusFixa(f, ym);
      return `<div class="person"><span>${esc(f.nome)} <span style="color:var(--muted)">· dia ${f.dia}</span></span><span>${chip(s)}</span></div>`;
    }).join("")}</div>
      <p style="margin:12px 0 0;font-size:13px;color:var(--ink-2)">${fxPend.length ? `${fxPend.length} pendente${fxPend.length > 1 ? "s" : ""} somando <b class="num">${money(sum(fxPend, (f) => f.valor))}</b>` : "Todas as contas do mês estão pagas."} · <a class="link" href="#fixas">ver todas</a></p>`
      : `<div class="empty"><p>Nenhuma conta fixa cadastrada.</p><a class="btn small" href="#fixas">Cadastrar</a></div>`;

    return kpis + `
      <section class="card">
        <div class="card-head"><h2>Receitas e despesas · últimos 6 meses</h2>
          <div class="legend"><span><i class="dot" style="background:var(--s1)"></i>Receitas</span><span><i class="dot" style="background:var(--s2)"></i>Despesas</span></div></div>
        ${evoChart()}
      </section>
      <div class="grid2">
        <section class="card"><div class="card-head"><h2>Despesas por categoria</h2><span class="sub num">${money(cur.des)}</span></div>${catsHtml}</section>
        <div style="display:grid;gap:20px;align-content:start;min-width:0">
          <section class="card"><div class="card-head"><h2>Quem pagou</h2><span class="sub">despesas do mês</span></div>${pessoasHtml}</section>
          <section class="card"><div class="card-head"><h2>Contas fixas</h2><span class="sub">${esc(monthLabel(ym))}</span></div>${fxHtml}</section>
        </div>
      </div>`;
  }

  function chip(s) {
    if (s === "pago") return `<span class="chip ok">✓ Pago</span>`;
    if (s === "atrasado") return `<span class="chip late">! Atrasado</span>`;
    return `<span class="chip wait">○ Pendente</span>`;
  }

  // ---------- Gráfico de evolução ----------
  let evoData = [];
  function niceStep(x) {
    if (x <= 0) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(x)));
    const f = x / p;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  }
  function barPath(x, y, w, h, r) {
    r = Math.min(r, w / 2, h);
    return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
  }
  function evoChart() {
    evoData = [];
    for (let k = -5; k <= 0; k++) { const ym = addMonths(state.ym, k); const t = totaisMes(ym); evoData.push({ ym, rec: t.rec, des: t.des }); }
    const W = 640, H = 230, pl = 64, pr = 8, pt = 12, pb = 28;
    const iw = W - pl - pr, ih = H - pt - pb;
    const rawMax = Math.max(1, ...evoData.flatMap((m) => [m.rec, m.des]));
    const step = niceStep(rawMax / 4);
    const max = step * 4;
    const y = (v) => pt + ih - (v / max) * ih;
    const gw = iw / evoData.length;
    const bw = Math.max(6, Math.min(26, (gw - 20) / 2));
    let s = "";
    for (let i = 0; i <= 4; i++) {
      const v = step * i, yy = y(v);
      s += `<line x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}" stroke="${i === 0 ? "var(--base)" : "var(--line)"}" stroke-width="1"/>`;
      s += `<text x="${pl - 8}" y="${yy + 4}" text-anchor="end" class="num">${esc(moneyShort(v))}</text>`;
    }
    evoData.forEach((m, i) => {
      const cx = pl + gw * i + gw / 2;
      const x0 = cx - bw - 1;
      if (m.rec > 0) s += `<path d="${barPath(x0, y(m.rec), bw, y(0) - y(m.rec), 4)}" fill="var(--s1)"/>`;
      if (m.des > 0) s += `<path d="${barPath(x0 + bw + 2, y(m.des), bw, y(0) - y(m.des), 4)}" fill="var(--s2)"/>`;
      const isCur = m.ym === state.ym;
      s += `<text x="${cx}" y="${H - 8}" text-anchor="middle" style="${isCur ? "fill:var(--ink);font-weight:600" : ""}">${esc(monthShort(m.ym))}</text>`;
      s += `<rect class="hit" data-i="${i}" x="${pl + gw * i}" y="${pt}" width="${gw}" height="${ih}" fill="transparent"/>`;
    });
    const tabela = `<details class="table-view"><summary>Ver como tabela</summary><div class="tbl-wrap"><table class="num"><thead><tr><th>Mês</th><th>Receitas</th><th>Despesas</th><th>Saldo</th></tr></thead><tbody>${evoData.map((m) => `<tr><td style="text-transform:capitalize">${esc(monthLabel(m.ym))}</td><td>${money(m.rec)}</td><td>${money(m.des)}</td><td class="${m.rec - m.des >= 0 ? "pos" : "neg"}">${money(m.rec - m.des)}</td></tr>`).join("")}</tbody></table></div></details>`;
    return `<div class="chart" id="evo"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Receitas e despesas dos últimos seis meses">${s}<line id="evo-cross" pointer-events="none" x1="0" x2="0" y1="${pt}" y2="${pt + ih}" stroke="var(--base)" stroke-width="1" visibility="hidden"/></svg><div class="tip" id="evo-tip" hidden></div></div>${tabela}`;
  }
  function wireChart() {
    const box = document.getElementById("evo");
    if (!box) return;
    const tip = document.getElementById("evo-tip");
    const svg = box.querySelector("svg");
    const show = (rect) => {
      const m = evoData[Number(rect.dataset.i)];
      tip.innerHTML = `<b>${esc(monthLabel(m.ym))}</b><div><span><i class="dot" style="background:var(--s1)"></i> Receitas</span><span class="num">${money(m.rec)}</span></div><div><span><i class="dot" style="background:var(--s2)"></i> Despesas</span><span class="num">${money(m.des)}</span></div><div style="border-top:1px solid var(--line);margin-top:4px;padding-top:4px"><span>Saldo</span><span class="num ${m.rec - m.des >= 0 ? "pos" : "neg"}">${money(m.rec - m.des)}</span></div>`;
      tip.hidden = false;
      const br = box.getBoundingClientRect(), rr = rect.getBoundingClientRect();
      let left = rr.left - br.left + rr.width / 2 + 10;
      if (left + tip.offsetWidth > br.width) left = rr.left - br.left + rr.width / 2 - tip.offsetWidth - 10;
      tip.style.left = Math.max(0, left) + "px"; tip.style.top = "4px";
      const cross = document.getElementById("evo-cross");
      const cx = Number(rect.getAttribute("x")) + Number(rect.getAttribute("width")) / 2;
      cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("visibility", "visible");
    };
    const hide = () => { tip.hidden = true; document.getElementById("evo-cross").setAttribute("visibility", "hidden"); };
    svg.querySelectorAll(".hit").forEach((r) => {
      r.addEventListener("pointerenter", () => show(r));
      r.addEventListener("click", () => show(r));
    });
    svg.addEventListener("pointerleave", hide);
  }

  // ---------- Lançamentos ----------
  function viewLancamentos() {
    const f = state.filters;
    let ls = lancDoMes(state.ym);
    const total = ls.length;
    if (f.tipo !== "todos") ls = ls.filter((l) => l.tipo === f.tipo);
    if (f.pessoa !== "todas") ls = ls.filter((l) => l.pessoa === f.pessoa);
    if (f.cat !== "todas") ls = ls.filter((l) => l.categoria === f.cat);
    if (f.q) { const q = f.q.toLowerCase(); ls = ls.filter((l) => (l.descricao || "").toLowerCase().includes(q) || (l.categoria || "").toLowerCase().includes(q)); }
    ls.sort((a, b) => b.data.localeCompare(a.data) || (b.criadoEm || "").localeCompare(a.criadoEm || ""));
    const rec = sum(ls.filter((l) => l.tipo === "receita"), (l) => l.valor);
    const des = sum(ls.filter((l) => l.tipo === "despesa"), (l) => l.valor);
    const allCats = [...new Set([...CAT_DESPESA, ...CAT_RECEITA])];
    const opt = (v, cur, label) => `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${esc(label || v)}</option>`;
    const filters = `<div class="filters">
      <select id="f-tipo" aria-label="Tipo">${opt("todos", f.tipo, "Tudo")}${opt("despesa", f.tipo, "Despesas")}${opt("receita", f.tipo, "Receitas")}</select>
      <select id="f-pessoa" aria-label="Pessoa">${opt("todas", f.pessoa, "Todos")}${PESSOAS.map((p) => opt(p, f.pessoa)).join("")}</select>
      <select id="f-cat" aria-label="Categoria">${opt("todas", f.cat, "Todas as categorias")}${allCats.map((c) => opt(c, f.cat)).join("")}</select>
      <input id="f-q" type="search" placeholder="Buscar descrição" value="${esc(f.q)}" data-keep="1" aria-label="Buscar">
    </div>`;
    let body;
    if (!total) body = `<div class="empty"><b>Nada lançado em ${esc(monthLabel(state.ym))}</b><p>Registre despesas e receitas pelo botão <strong>+ Lançar</strong>. Cada lançamento guarda valor, data, categoria e quem pagou.</p></div>`;
    else if (!ls.length) body = `<div class="empty"><p>Nenhum lançamento corresponde aos filtros.</p></div>`;
    else {
      const byDay = {};
      ls.forEach((l) => (byDay[l.data] = byDay[l.data] || []).push(l));
      body = `<div class="list">${Object.keys(byDay).sort().reverse().map((d) => {
        const items = byDay[d];
        const [yy, mm, dd] = d.split("-").map(Number);
        const net = sum(items, (l) => (l.tipo === "receita" ? l.valor : -l.valor));
        return `<div class="day-head"><span>${esc(fmtDay.format(new Date(yy, mm - 1, dd)))}</span><span class="num">${net >= 0 ? "+" : "−"}${money(Math.abs(net))}</span></div>` +
          items.map((l) => `<button class="item" data-act="editar" data-id="${esc(l.id)}">
            <span class="ic" style="${l.tipo === "receita" ? "color:var(--s1)" : ""}">${esc(SIGLA[l.categoria] || "··")}</span>
            <span class="t"><b>${esc(l.descricao || l.categoria)}</b><small>${esc(l.categoria)} · <i class="dot" style="background:${PESSOA_COR[l.pessoa] || "var(--muted)"}"></i> ${esc(l.pessoa)}${l.fixaId ? " · conta fixa" : ""}</small></span>
            <span class="amt num ${l.tipo === "receita" ? "pos" : ""}">${l.tipo === "receita" ? "+" : "−"}${money(l.valor)}</span>
          </button>`).join("");
      }).join("")}</div>`;
    }
    return `<section class="card">
      <div class="card-head"><h2>Lançamentos de ${esc(monthLabel(state.ym))}</h2><span class="sub">${ls.length} de ${total}</span></div>
      ${filters}
      <div class="totals num"><span>Receitas <b class="pos">${money(rec)}</b></span><span>Despesas <b>${money(des)}</b></span><span>Saldo <b class="${rec - des >= 0 ? "pos" : "neg"}">${money(rec - des)}</b></span></div>
      ${body}
    </section>`;
  }

  // ---------- Orçamento ----------
  function viewOrcamento() {
    const cur = totaisMes(state.ym);
    const gasto = {};
    cur.ls.filter((l) => l.tipo === "despesa").forEach((l) => (gasto[l.categoria] = (gasto[l.categoria] || 0) + l.valor));
    const totLim = sum(Object.values(state.limites));
    const totGasto = cur.des;
    const dia = state.ym === ymOf(new Date()) ? new Date().getDate() : daysIn(state.ym);
    const ritmo = dia / daysIn(state.ym);
    const rows = CAT_DESPESA.map((c) => {
      const lim = state.limites[c] || 0, g = gasto[c] || 0;
      const pct = lim ? g / lim : 0;
      let color = "var(--good)", st = "";
      if (lim) {
        if (pct > 1) { color = "var(--crit)"; st = `<span class="neg">! Estourou ${money(g - lim)}</span>`; }
        else if (pct >= 0.8) { color = "var(--warn)"; st = `<span style="color:var(--warn-ink)">Atenção · resta ${money(lim - g)}</span>`; }
        else st = `<span class="pos">Resta ${money(lim - g)}</span>`;
      } else st = `<span style="color:var(--muted)">sem limite</span>`;
      return `<div class="bud-row">
        <b style="font-weight:600">${esc(c)}</b>
        <div class="bar"><div class="track"><div class="fill" style="width:${lim ? Math.min(100, pct * 100) : 0}%;background:${color}"></div></div><small class="num"><span>${money(g)}${lim ? ` de ${money(lim)} · ${Math.round(pct * 100)}%` : ""}</span>${st}</small></div>
        <label class="money-in"><span>R$</span><input class="num" inputmode="decimal" data-keep="1" data-lim="${esc(c)}" value="${esc(centsToInput(lim))}" placeholder="0,00" aria-label="Limite para ${esc(c)}" ${state.readOnly ? "disabled" : ""}></label>
      </div>`;
    }).join("");
    const pctTot = totLim ? totGasto / totLim : 0;
    return `<section class="kpis">
        <div class="kpi"><span class="lbl">Limite total</span><span class="val num">${totLim ? money(totLim) : "—"}</span><span class="meta">soma dos limites por categoria</span></div>
        <div class="kpi"><span class="lbl">Gasto até agora</span><span class="val num">${money(totGasto)}</span><span class="meta">${totLim ? `${Math.round(pctTot * 100)}% do orçamento` : "defina limites abaixo"}</span></div>
        <div class="kpi"><span class="lbl">Ritmo do mês</span><span class="val num">${Math.round(ritmo * 100)}%</span><span class="meta">${totLim ? (pctTot > ritmo + 0.05 ? `<span class="neg">gastando acima do ritmo</span>` : `<span class="pos">dentro do ritmo</span>`) : "dos dias do mês já passou"}</span></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>Limites por categoria</h2><span class="sub">valem para todos os meses</span></div>
        <div class="bud">${rows}</div>
        ${state.readOnly ? "" : `<div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn primary" data-act="salvar-orc">Salvar limites</button></div>`}
      </section>`;
  }

  // ---------- Contas fixas ----------
  function viewFixas() {
    const ym = state.ym;
    const fx = fixasAtivas();
    const tot = sum(fx, (f) => f.valor);
    const pagas = fx.filter((f) => statusFixa(f, ym) === "pago");
    const list = fx.length ? fx.map((f) => {
      const s = statusFixa(f, ym);
      const pg = pagamentoFixa(f.id, ym);
      return `<div class="fx">
        <div class="t"><b>${esc(f.nome)}</b><small>${esc(f.categoria)} · vence dia ${f.dia} · ${esc(f.pessoa)}${pg ? ` · pago ${money(pg.valor)}` : ""}</small></div>
        <span class="num" style="font-weight:600">${money(f.valor)}</span>
        <div class="acts">${chip(s)}${state.readOnly ? "" : (s === "pago"
          ? `<button class="btn small" data-act="desfazer-fixa" data-id="${esc(f.id)}">Desfazer</button>`
          : `<button class="btn small primary" data-act="pagar-fixa" data-id="${esc(f.id)}">Marcar pago</button>`) +
          `<button class="btn small" data-act="editar-fixa" data-id="${esc(f.id)}">Editar</button>`}</div>
      </div>`;
    }).join("") : `<div class="empty"><b>Nenhuma conta fixa</b><p>Cadastre aluguel, condomínio, luz, internet e outras contas que se repetem. Todo mês é só marcar como paga, e a despesa entra sozinha nos lançamentos.</p></div>`;
    return `<section class="kpis">
        <div class="kpi"><span class="lbl">Total fixo por mês</span><span class="val num">${money(tot)}</span><span class="meta">${fx.length} conta${fx.length === 1 ? "" : "s"}</span></div>
        <div class="kpi"><span class="lbl">Pagas em ${esc(monthShort(ym))}</span><span class="val num">${pagas.length}/${fx.length}</span><span class="meta">${money(sum(pagas, (f) => pagamentoFixa(f.id, ym).valor))} pagos</span></div>
        <div class="kpi"><span class="lbl">Falta pagar</span><span class="val num">${money(sum(fx.filter((f) => statusFixa(f, ym) !== "pago"), (f) => f.valor))}</span><span class="meta">${fx.filter((f) => statusFixa(f, ym) === "atrasado").length} atrasada(s)</span></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>Contas de ${esc(monthLabel(ym))}</h2>${state.readOnly ? "" : `<button class="btn small" data-act="nova-fixa">+ Nova conta fixa</button>`}</div>
        ${list}
      </section>`;
  }

  async function pagarFixa(id) {
    const f = state.fixas.get(id); if (!f) return;
    const data = state.ym + "-" + pad(Math.min(f.dia || 1, daysIn(state.ym)));
    const ok = await writeDoc("lancamentos", null, {
      tipo: "despesa", valor: f.valor, data, categoria: f.categoria, pessoa: f.pessoa || "Os dois",
      descricao: f.nome, fixaId: f.id, criadoEm: new Date().toISOString(),
    });
    if (ok) toast(`${f.nome} marcada como paga`);
  }
  async function desfazerFixa(id) {
    const pg = pagamentoFixa(id, state.ym);
    if (pg && (await deleteDoc("lancamentos", pg.id))) toast("Pagamento desfeito");
  }

  // ---------- Formulários ----------
  function closeSheet() { document.getElementById("sheet-root").innerHTML = ""; if (state.pendingRender) render(); }
  function openLanc(id) {
    const l = id ? state.lanc.get(id) : null;
    const hoje = todayISO();
    const d0 = l ? l.data : (hoje.startsWith(state.ym) ? hoje : state.ym + "-01");
    const f = { tipo: l ? l.tipo : "despesa", pessoa: l ? l.pessoa : "Daniel" };
    const root = document.getElementById("sheet-root");
    const catOpts = (tipo, cur) => (tipo === "receita" ? CAT_RECEITA : CAT_DESPESA).map((c) => `<option ${c === cur ? "selected" : ""}>${esc(c)}</option>`).join("");
    root.innerHTML = `<div class="sheet-bg" data-act="fechar-bg"><form class="sheet" id="lanc-form" role="dialog" aria-modal="true" aria-labelledby="lanc-title" novalidate>
      <h3 id="lanc-title">${l ? "Editar lançamento" : "Novo lançamento"}</h3>
      <div class="seg" role="group" aria-label="Tipo">
        <button type="button" data-tipo="despesa" aria-pressed="${f.tipo === "despesa"}">Despesa</button>
        <button type="button" data-tipo="receita" aria-pressed="${f.tipo === "receita"}">Receita</button>
      </div>
      <div class="field"><label for="l-valor">Valor</label><div class="money-in"><span>R$</span><input id="l-valor" class="num" inputmode="decimal" placeholder="0,00" value="${esc(l ? centsToInput(l.valor) : "")}" autocomplete="off" required></div></div>
      <div class="row2">
        <div class="field"><label for="l-data">Data</label><input id="l-data" type="date" value="${esc(d0)}" required></div>
        <div class="field"><label for="l-cat">Categoria</label><select id="l-cat">${catOpts(f.tipo, l && l.categoria)}</select></div>
      </div>
      <div class="field"><span class="lab" id="l-pessoa-lab">${f.tipo === "receita" ? "Quem recebeu" : "Quem pagou"}</span>
        <div class="seg" role="group" aria-labelledby="l-pessoa-lab">${PESSOAS.map((p) => `<button type="button" data-pessoa="${esc(p)}" aria-pressed="${p === f.pessoa}">${esc(p)}</button>`).join("")}</div></div>
      <div class="field"><label for="l-desc">Descrição</label><input id="l-desc" placeholder="Ex.: compra do mês no Assaí" value="${esc(l ? l.descricao : "")}" maxlength="120"></div>
      <p class="err" id="l-err" hidden></p>
      <div class="acts">
        ${l ? `<div id="del-zone"><button type="button" class="btn danger" data-act="del-ask">Excluir</button></div>` : ""}
        <div class="right"><button type="button" class="btn" data-act="fechar">Cancelar</button><button type="submit" class="btn primary">${l ? "Salvar" : "Lançar"}</button></div>
      </div>
    </form></div>`;
    const form = document.getElementById("lanc-form");
    setTimeout(() => document.getElementById("l-valor").focus(), 30);
    form.addEventListener("click", async (e) => {
      const t = e.target.closest("button"); if (!t) return;
      if (t.dataset.tipo) {
        f.tipo = t.dataset.tipo;
        form.querySelectorAll("[data-tipo]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.tipo === f.tipo));
        document.getElementById("l-cat").innerHTML = catOpts(f.tipo);
        document.getElementById("l-pessoa-lab").textContent = f.tipo === "receita" ? "Quem recebeu" : "Quem pagou";
      }
      if (t.dataset.pessoa) { f.pessoa = t.dataset.pessoa; form.querySelectorAll("[data-pessoa]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.pessoa === f.pessoa)); }
      if (t.dataset.act === "fechar") closeSheet();
      if (t.dataset.act === "del-ask") document.getElementById("del-zone").innerHTML = `<div class="confirm"><span>Excluir mesmo?</span><button type="button" class="btn danger small" data-act="del-yes">Sim, excluir</button><button type="button" class="btn small" data-act="del-no">Não</button></div>`;
      if (t.dataset.act === "del-no") document.getElementById("del-zone").innerHTML = `<button type="button" class="btn danger" data-act="del-ask">Excluir</button>`;
      if (t.dataset.act === "del-yes") { if (await deleteDoc("lancamentos", l.id)) { closeSheet(); toast("Lançamento excluído"); } }
    });
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("l-err");
      const valor = parseMoney(document.getElementById("l-valor").value);
      const data = document.getElementById("l-data").value;
      if (!(valor > 0)) { err.textContent = "Digite um valor maior que zero, por exemplo 45,90."; err.hidden = false; return; }
      if (!/^\d{4}-\d{2}-\d{2}$/.test(data)) { err.textContent = "Escolha a data do lançamento."; err.hidden = false; return; }
      const doc = {
        tipo: f.tipo, valor, data, categoria: document.getElementById("l-cat").value, pessoa: f.pessoa,
        descricao: document.getElementById("l-desc").value.trim(), criadoEm: l ? (l.criadoEm || new Date().toISOString()) : new Date().toISOString(),
      };
      if (l && l.fixaId) doc.fixaId = l.fixaId;
      const btn = form.querySelector("button[type=submit]"); btn.disabled = true;
      const ok = await writeDoc("lancamentos", l ? l.id : null, doc);
      btn.disabled = false;
      if (ok) {
        closeSheet();
        toast(l ? "Lançamento atualizado" : `${f.tipo === "receita" ? "Receita" : "Despesa"} de ${money(valor)} lançada`);
        if (!data.startsWith(state.ym)) { state.ym = data.slice(0, 7); subscribeLanc(); render(); }
      }
    });
  }

  function openFixa(id) {
    const fx = id ? state.fixas.get(id) : null;
    const st = { pessoa: fx ? fx.pessoa : "Os dois" };
    const root = document.getElementById("sheet-root");
    root.innerHTML = `<div class="sheet-bg" data-act="fechar-bg"><form class="sheet" id="fixa-form" role="dialog" aria-modal="true" aria-labelledby="fx-title" novalidate>
      <h3 id="fx-title">${fx ? "Editar conta fixa" : "Nova conta fixa"}</h3>
      <div class="field"><label for="x-nome">Nome</label><input id="x-nome" placeholder="Ex.: Aluguel, Internet, Luz" value="${esc(fx ? fx.nome : "")}" maxlength="60" required></div>
      <div class="row2">
        <div class="field"><label for="x-valor">Valor mensal</label><div class="money-in"><span>R$</span><input id="x-valor" class="num" inputmode="decimal" placeholder="0,00" value="${esc(fx ? centsToInput(fx.valor) : "")}"></div></div>
        <div class="field"><label for="x-dia">Vence no dia</label><input id="x-dia" type="number" min="1" max="31" value="${fx ? fx.dia : 10}"></div>
      </div>
      <div class="field"><label for="x-cat">Categoria</label><select id="x-cat">${CAT_DESPESA.map((c) => `<option ${(fx ? fx.categoria : "Contas da casa") === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></div>
      <div class="field"><span class="lab" id="x-p-lab">Quem costuma pagar</span><div class="seg" role="group" aria-labelledby="x-p-lab">${PESSOAS.map((p) => `<button type="button" data-pessoa="${esc(p)}" aria-pressed="${p === st.pessoa}">${esc(p)}</button>`).join("")}</div></div>
      <p class="err" id="x-err" hidden></p>
      <div class="acts">
        ${fx ? `<div id="xdel-zone"><button type="button" class="btn danger" data-act="del-ask">Remover</button></div>` : ""}
        <div class="right"><button type="button" class="btn" data-act="fechar">Cancelar</button><button type="submit" class="btn primary">Salvar</button></div>
      </div>
    </form></div>`;
    const form = document.getElementById("fixa-form");
    setTimeout(() => document.getElementById("x-nome").focus(), 30);
    form.addEventListener("click", async (e) => {
      const t = e.target.closest("button"); if (!t) return;
      if (t.dataset.pessoa) { st.pessoa = t.dataset.pessoa; form.querySelectorAll("[data-pessoa]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.pessoa === st.pessoa)); }
      if (t.dataset.act === "fechar") closeSheet();
      if (t.dataset.act === "del-ask") document.getElementById("xdel-zone").innerHTML = `<div class="confirm"><span>Remover a conta? Os pagamentos já lançados continuam.</span><button type="button" class="btn danger small" data-act="del-yes">Remover</button><button type="button" class="btn small" data-act="del-no">Não</button></div>`;
      if (t.dataset.act === "del-no") document.getElementById("xdel-zone").innerHTML = `<button type="button" class="btn danger" data-act="del-ask">Remover</button>`;
      if (t.dataset.act === "del-yes") { if (await deleteDoc("fixas", fx.id)) { closeSheet(); toast("Conta fixa removida"); } }
    });
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("x-err");
      const nome = document.getElementById("x-nome").value.trim();
      const valor = parseMoney(document.getElementById("x-valor").value);
      const dia = Math.round(Number(document.getElementById("x-dia").value));
      if (!nome) { err.textContent = "Dê um nome para a conta."; err.hidden = false; return; }
      if (!(valor > 0)) { err.textContent = "Digite o valor mensal, por exemplo 129,90."; err.hidden = false; return; }
      if (!(dia >= 1 && dia <= 31)) { err.textContent = "O dia de vencimento vai de 1 a 31."; err.hidden = false; return; }
      const ok = await writeDoc("fixas", fx ? fx.id : null, { nome, valor, dia, categoria: document.getElementById("x-cat").value, pessoa: st.pessoa, ativa: true });
      if (ok) { closeSheet(); toast(fx ? "Conta fixa atualizada" : `${nome} cadastrada`); }
    });
  }

  // ---------- Eventos ----------
  function setView() {
    const h = (location.hash || "").replace("#", "");
    state.view = ["resumo", "lancamentos", "orcamento", "fixas"].includes(h) ? h : "resumo";
    render();
  }
  window.addEventListener("hashchange", setView);
  document.getElementById("prev").addEventListener("click", () => { state.ym = addMonths(state.ym, -1); subscribeLanc(); render(); });
  document.getElementById("next").addEventListener("click", () => { state.ym = addMonths(state.ym, 1); subscribeLanc(); render(); });
  document.getElementById("fab").addEventListener("click", () => openLanc());
  document.getElementById("sheet-root").addEventListener("click", (e) => { if (e.target.dataset && e.target.dataset.act === "fechar-bg") closeSheet(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && document.getElementById("sheet-root").firstChild) closeSheet(); });

  const view = document.getElementById("view");
  view.addEventListener("click", async (e) => {
    const t = e.target.closest("[data-act]"); if (!t) return;
    const a = t.dataset.act;
    if (a === "novo") openLanc();
    if (a === "editar") { if (!state.readOnly) openLanc(t.dataset.id); }
    if (a === "nova-fixa") openFixa();
    if (a === "editar-fixa") openFixa(t.dataset.id);
    if (a === "pagar-fixa") { t.disabled = true; await pagarFixa(t.dataset.id); }
    if (a === "desfazer-fixa") { t.disabled = true; await desfazerFixa(t.dataset.id); }
    if (a === "salvar-orc") {
      const lim = {}; let bad = null;
      view.querySelectorAll("[data-lim]").forEach((inp) => {
        const raw = inp.value.trim(); if (!raw) return;
        const v = parseMoney(raw);
        if (!(v >= 0)) bad = inp.dataset.lim; else if (v > 0) lim[inp.dataset.lim] = v;
      });
      if (bad) { toast(`Valor inválido em ${bad}. Use o formato 1.500,00.`); return; }
      t.disabled = true;
      if (await saveLimites(lim)) toast("Limites salvos");
      t.disabled = false;
      render();
    }
  });
  view.addEventListener("change", (e) => {
    const id = e.target.id;
    if (id === "f-tipo") { state.filters.tipo = e.target.value; render(); }
    if (id === "f-pessoa") { state.filters.pessoa = e.target.value; render(); }
    if (id === "f-cat") { state.filters.cat = e.target.value; render(); }
  });
  let qTimer;
  view.addEventListener("input", (e) => {
    if (e.target.id === "f-q") {
      clearTimeout(qTimer);
      qTimer = setTimeout(() => {
        state.filters.q = e.target.value.trim();
        const pos = e.target.selectionStart;
        const a = document.activeElement; a.blur(); render();
        const n = document.getElementById("f-q"); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (_) {} }
      }, 250);
    }
  });
  view.addEventListener("focusout", () => { setTimeout(() => { if (state.pendingRender && !(document.activeElement && document.activeElement.dataset && document.activeElement.dataset.keep)) render(); }, 0); });

  setView();
  init();
})();
</script>
